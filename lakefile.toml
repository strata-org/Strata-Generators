name = "strata-generators"
version = "0.1.0"
defaultTargets = ["StrataGenerators.HasTypeAGen", "StrataGenerators.HasTypeGen", "StrataGenerators.CmdHasTypeAGen"]

[[require]]
name = "Strata"
git = "https://github.com/ngernest/Strata"
rev = "53e18212ceda89dd83f855e073865d1e194173be"

[[require]]
name = "basalt"
git = "https://github.com/hgoldstein95/basalt"
rev = "ernest/combinators"

# Core generator definitions (no Factory, no Mathlib — shared by Defs and HasTypeAGen)
[[lean_lib]]
name = "StrataGenerators.HasTypeAGen.Core"
roots = ["StrataGenerators.HasTypeAGen.Core"]

# Generator definitions only (no Mathlib, compatible with LExprEval)
[[lean_lib]]
name = "StrataGenerators.HasTypeAGen.Defs"
roots = ["StrataGenerators.HasTypeAGen.Defs"]

# Shared test utilities (eval, isValue, defaultFCtx); imports LExprEval
[[lean_lib]]
name = "StrataGenerators.HasTypeAGen.TestSupport"
roots = ["StrataGenerators.HasTypeAGen.TestSupport"]

# The HasTypeA generator (uses Basalt.Examples.ArbNat → Mathlib → Batteries)
[[lean_lib]]
name = "StrataGenerators.HasTypeAGen"
roots = ["StrataGenerators.HasTypeAGen"]

# The HasType generator (uses LExprTypeSpec → Strata.DL.Util.List)
# Cannot coexist with HasTypeAGen in one environment due to List.Forall₂ conflict.
[[lean_lib]]
name = "StrataGenerators.HasTypeGen"
roots = ["StrataGenerators.HasTypeGen"]

# STLC generator with soundness and completeness proofs
[[lean_lib]]
name = "StrataGenerators.STLC"
roots = ["StrataGenerators.STLC"]

# Playground for experimenting with manually written Basalt proofs
[[lean_lib]]
name = "StrataGenerators.ArithExprs"
roots = ["StrataGenerators.ArithExprs"]

# Core Cmd generator definitions (no Mathlib)
[[lean_lib]]
name = "StrataGenerators.CmdHasTypeAGen.Core"
roots = ["StrataGenerators.CmdHasTypeAGen.Core"]

# Shared Cmd test utilities (ppCmd, properties, generator wrappers)
[[lean_lib]]
name = "StrataGenerators.CmdHasTypeAGen.TestSupport"
roots = ["StrataGenerators.CmdHasTypeAGen.TestSupport"]

# The CmdHasTypeA generator with soundness/completeness proofs
[[lean_lib]]
name = "StrataGenerators.CmdHasTypeAGen"
roots = ["StrataGenerators.CmdHasTypeAGen"]

# Shared SetGen infrastructure (no conflicting imports)
[[lean_lib]]
name = "StrataGenerators.SetGen"
roots = ["StrataGenerators.SetGen"]

[[lean_exe]]
name = "strata-generators"
root = "Main"

# Tyche visualization support (no conflicting imports)
[[lean_lib]]
name = "StrataGenerators.Tyche"
roots = ["StrataGenerators.Tyche"]

# Tyche visualization executable (uses HasTypeAGen)
[[lean_exe]]
name = "tyche-viz"
root = "TycheMain"

# Property-based test executable (uses Plausible + LExpr.eval)
[[lean_exe]]
name = "test-lexpr"
root = "PlausibleTestMain"
