name = "strata-generators"
version = "0.1.0"
defaultTargets = ["StrataGenerators"]
testDriver = "test"

[[require]]
name = "Strata"
git = "https://github.com/strata-org/Strata"
rev = "main"

[[require]]
name = "basalt"
git = "https://github.com/hgoldstein95/basalt"
rev = "lean-4.29"

[[require]]
name = "LSpec"
git = "https://github.com/ngernest/LSpec"
rev = "aa07f8c"

[[lean_lib]]
name = "StrataGenerators"
globs = ["StrataGenerators.*"]

[[lean_exe]]
name = "strata-generators"
root = "Main"

[[lean_exe]]
name = "test"
root = "TestMain"

# Alternate test driver without LSpec dependency
[[lean_exe]]
name = "test-plain"
root = "PlainTestMain"
