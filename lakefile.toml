name = "strata-generators"
version = "0.1.0"
defaultTargets = ["StrataGenerators", "StrataTests"]
testDriver = "test"

[[require]]
name = "Strata"
git = "https://github.com/strata-org/Strata"
rev = "main"

# We use Plausible's public v4.34 tag to ensure consistency in Lean version
[[require]]
name = "plausible"
git = "https://github.com/leanprover-community/plausible"
rev = "v4.34.0"

# We use a branch of Basalt where the Lean version is pinned to 4.34 
# (Basalt's `main` branch is on 4.35). 
# (Note: this is newer than Basalt's current 4.34 tag, which is out of date)
[[require]]
name = "basalt"
git = "https://github.com/hgoldstein95/basalt"
rev = "lean-4.34"

# Note: LSpec's `main` branch is on 4.31, not 4.30, so a warning will appear 
# when we do `lake build` -- this is a benign warning and fine to ignore.
[[require]]
name = "LSpec"
git = "https://github.com/argumentcomputer/LSpec"
rev = "main"

# The mathlib release for Lean 4.34.0
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

[[lean_lib]]
name = "StrataGenerators"
globs = ["StrataGenerators.*"]

# FuzzGen experiment (branch `fuzz/experiment`): the Mathlib-free root of the opt-in `strata-fuzz`
# executable. `fuzz-experiment/scripts/build.sh` elaborates and links it against libFuzzer; the
# default `lake build` only elaborates it. Mirrors basalt's `BasaltFuzzMain` target.
[[lean_lib]]
name = "StrataFuzzMain"
globs = ["StrataFuzzMain", "StrataFuzz.+"]

# The property files. Globbed, so a new file under `StrataTests/` is compiled without
# a configuration change. A default target, so a plain `lake build` — which is all CI
# runs, since the suite reports known counterexamples and would fail it — still
# compiles every property. `StrataTests.lean` is the import root the drivers read;
# regenerate it with `lake exe write-test-imports`.
[[lean_lib]]
name = "StrataTests"
globs = ["StrataTests.*"]

[[lean_exe]]
name = "strata-generators"
root = "Main"

# The `lake test` driver: the registry rendered by LSpec.
[[lean_exe]]
name = "test"
root = "LSpecTestRunner"

# The same registry rendered by the package's own reporter, with no test-framework
# dependency. Kept so that the LSpec dependency stays droppable, and so that a
# discrepancy between the two renderings is visible rather than assumed away.
[[lean_exe]]
name = "test-plain"
root = "PlainTestRunner"

# Rewrites `StrataTests.lean` from the contents of `StrataTests/`. Needed only when a
# file is added or removed there.
[[lean_exe]]
name = "write-test-imports"
root = "WriteTestImports"

# Distribution report. It samples each tunable generator under each tuning profile and
# prints how often the shapes that the suite's properties discriminate on appear. This is
# how the weights of each profile were derived, and how to derive them again after a
# change to a generator.
# Run: `lake exe dist-report [samples] [maxSize] [--stmt] [--proc] [--cmd] [--expr] [--prog]`
[[lean_exe]]
name = "dist-report"
root = "DistReportMain"
