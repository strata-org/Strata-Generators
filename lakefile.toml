name = "strata-generators"
version = "0.1.0"
defaultTargets = ["StrataGenerators"]
testDriver = "test"

[[require]]
name = "Strata"
git = "https://github.com/ngernest/Strata"
rev = "7f94d01f"

[[require]]
name = "basalt"
git = "https://github.com/hgoldstein95/basalt"
# `lean-4.29` HEAD as of 2026-08-17. Pinned to a commit rather than the branch
# name so the `@[tunable]` attribute (Basalt/Tuning/Attr.lean, which replaced the
# older `tunable def` macro) stays at a known revision.
rev = "3da2b2482e6d57cb01362e190a0ff7d9e90ec58a"

[[require]]
name = "LSpec"
git = "https://github.com/ngernest/LSpec"
rev = "aa07f8c"

# A single library covering every module under `StrataGenerators/`. The glob
# `StrataGenerators.*` selects `StrataGenerators` and all of its submodules, so
# new files are picked up automatically without adding a stanza per module.
[[lean_lib]]
name = "StrataGenerators"
globs = ["StrataGenerators.*"]

[[lean_exe]]
name = "strata-generators"
root = "Main"

# The single merged test driver (registered as the `lake test` driver above). It
# exercises the expr/command/function/statement generators via Plausible + LSpec
# and — unless `--no-tyche` is passed — also writes Tyche visualization panels.
# Run: `lake test -- [numTrials] [maxSize] [--no-tyche] [--tyche-out=PATH] [--tyche-samples=N]`
[[lean_exe]]
name = "test"
root = "TestMain"

# A second test driver that reproduces the same suite *without* the LSpec
# dependency, to de-risk dropping LSpec in the future (see issue #21). It imports
# the same shared `StrataGenerators.TestScaffold` as `test`, so the two cannot
# drift, and runs the properties through the ~small Plausible-only harness in
# `StrataGenerators.PlainHarness` instead of `LSpec.checkIO`/`lspecIO`. It is
# deliberately NOT the registered `lake test` driver (that stays `test`).
# Run: `lake build test-plain && .lake/build/bin/test-plain [numTrials] [maxSize] [--smt]`
[[lean_exe]]
name = "test-plain"
root = "PlainTestMain"
