name = "strata-generators"
version = "0.1.0"
defaultTargets = ["StrataGenerators"]

[[require]]
name = "Strata"
git = "https://github.com/ngernest/Strata"
rev = "1d858fb03"

[[require]]
name = "basalt"
git = "https://github.com/hgoldstein95/basalt"
rev = "lean-4.29"

# A single library covering every module under `StrataGenerators/`. The glob
# `StrataGenerators.*` selects `StrataGenerators` and all of its submodules, so
# new files are picked up automatically without adding a stanza per module.
[[lean_lib]]
name = "StrataGenerators"
globs = ["StrataGenerators.*"]

[[lean_exe]]
name = "strata-generators"
root = "Main"

# Tyche visualization executable (uses HasTypeAGen)
[[lean_exe]]
name = "tyche-viz"
root = "TycheMain"

# Property-based test executable (uses Plausible + LExpr.eval)
[[lean_exe]]
name = "test-lexpr"
root = "PlausibleTestMain"
